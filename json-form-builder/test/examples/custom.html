<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Styled Form Example</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f2f5;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-container {
            margin-top: 20px;
        }

        .required {
            color: #ff0000;
            margin-left: 4px;
            font-weight: bold;
        }

        .error-message {
            color: #ff0000;
            font-size: 0.9em;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .error-icon {
            width: 16px;
            height: 16px;
        }

        .form-button {
            background-color: #1a73e8;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 300px;
            margin: 1rem auto;
            display: block;
        }

        .form-button:hover {
            background-color: #1557b0;
        }

        .form-field {
            margin-bottom: 20px;
        }

        /* Make all form labels bold */
        .form-field label,
        .form-field-group label {
            display: block;
            margin-bottom: 8px;
            color: #5f6368;
            font-weight: 500;
        }

        .input_box {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8eaed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .input_box:focus {
            border-color: #1a73e8;
            outline: none;
        }

        .input_box.error {
            border-color: #ff0000;
        }

        .language-switcher {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: flex-end;
        }

        .language-switcher select {
            padding: 8px 12px;
            border: 2px solid #e8eaed;
            border-radius: 8px;
            font-size: 14px;
            color: #5f6368;
        }

        .form-group {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }

        .form-field-group {
            flex: 1;
        }

        /* RTL Support */
        [dir="rtl"] .language-switcher {
            justify-content: flex-start;
        }

        [dir="rtl"] .required {
            margin-left: 0;
            margin-right: 4px;
        }

        [dir="rtl"] .error-message {
            text-align: right;
        }

        [dir="rtl"] .form-field label,
        [dir="rtl"] .form-field-group label {
            text-align: right;
        }

        [dir="rtl"] .input_box {
            text-align: right;
        }

        [dir="rtl"] .form-group {
            flex-direction: row-reverse;
        }

        [dir="rtl"] .form-field-group {
            flex-direction: column-reverse;
        }

        @media (max-width: 768px) {
            .form-group {
                flex-direction: column;
                gap: 16px;
            }

            [dir="rtl"] .form-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Custom Styled Form</h1>
        <div id="form-container" class="form-container"></div>
    </div>

    <script type="module">
        import JsonFormBuilder from '../../dist/JsonFormBuilder.esm.js';

        const config = {
            schema: [
                {
                    id: 'fullName',
                    controlType: 'textbox',
                    type: 'simpleType',
                    label: {
                        eng: 'Full Name',
                        fra: 'Nom complet',
                        ara: 'الاسم الكامل'
                    },
                    required: true,
                    validators: [
                        {
                            type: 'regex',
                            validator: '^[a-zA-Z ]+$',
                            errorCode: 'Only letters and spaces allowed',
                            langCode: 'eng'
                        },
                        {
                            type: 'regex',
                            validator: '^[a-zA-ZÀ-ÿ ]+$',
                            errorCode: 'Seuls les lettres et les espaces sont autorisés',
                            langCode: 'fra'
                        },
                        {
                            type: 'regex',
                            validator: '^[\u0600-\u06FF ]+$',
                            errorCode: 'يُسمح فقط بالحروف والمسافات',
                            langCode: 'ara'
                        }
                    ],
                    alignmentGroup: 'personal'
                },
                {
                    id: 'email',
                    controlType: 'textbox',
                    type: 'string',
                    label: {
                        eng: 'Email',
                        fra: 'Courriel',
                        ara: 'البريد الإلكتروني'
                    },
                    required: true,
                    validators: [
                        {
                            type: 'regex',
                            validator: '^[^@]+@[^@]+\\.[^@]+$',
                            errorCode: 'Invalid email format'
                        }
                    ],
                    alignmentGroup: 'personal'
                },
                {
                    id: 'phone',
                    controlType: 'textbox',
                    type: 'string',
                    label: {
                        eng: 'Phone Number',
                        fra: 'Numéro de téléphone',
                        ara: 'رقم الهاتف'
                    },
                    required: true,
                    validators: [
                        {
                            type: 'regex',
                            validator: '^\\+?[0-9]{10,}$',
                            errorCode: 'Invalid phone number'
                        }
                    ],
                    alignmentGroup: 'contact'
                }
            ],
            mandatoryLanguages: ['eng'],
            optionalLanguages: ['fra', 'ara']
        };

        const additionalConfig = {
            submitButton: {
                label: 'Submit',
                action: (data) => {
                    console.log('Form submitted:', data);
                    alert('Form submitted successfully! Check console for data.');
                }
            },
            language: {
                currentLanguage: 'eng',
                defaultLanguage: 'eng',
                showLanguageSwitcher: true,
                languageSwitcherPosition: 'top',
                availableLanguages: ['eng', 'fra', 'ara'],
                rtlLanguages: ['ara', 'ar', 'he', 'fa', 'ur']
            }
        };

        const formBuilder = JsonFormBuilder(config, 'form-container', additionalConfig);
        formBuilder.render();
    </script>
</body>
</html>
